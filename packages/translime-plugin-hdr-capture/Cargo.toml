[package]
name = "hdr-capture-native"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]
path = "native/src/lib.rs"

[dependencies]
# Node.js 绑定
napi = { version = "2", features = ["napi9", "async"] }
napi-derive = "2"
rayon = "1.10"

# Windows API
windows = { version = "0.58", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_System_WinRT_Direct3D11",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Foundation",
] }

# 图像处理
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# EXR (OpenEXR) 格式支持 - 用于保存 HDR 原始数据
exr = "1.73"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
opt-level = 3

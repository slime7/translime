[package]
name = "hdr-capture-native"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]
path = "native/src/lib.rs"

[dependencies]
# Node.js 绑定
napi = { version = "2", features = ["napi9", "async"] }
napi-derive = "2"

# Windows API
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }

# 图像处理
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
opt-level = 3

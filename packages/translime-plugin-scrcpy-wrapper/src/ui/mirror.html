<!DOCTYPE html>
<!-- data-mat-theme 禁用 mde.css 的系统明暗回退令牌，主题以宿主注入的 CSS 变量为准 -->
<html lang="zh-CN" data-mat-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrcpy</title>
  <!-- 先于 mde.css 确立完整层序：mde.css 首次加载会抢占层序首声明位置 -->
  <style>
    @layer tailwind-theme, tailwind-reset, mde, tailwind-utilities, mde-final;
  </style>
  <link rel="stylesheet" href="app://./libs/mde/mde.css" data-translime-mde-css="true">
  <script type="importmap">
  {
    "imports": {
      "vue": "app://./libs/vue/vue.esm-browser.js",
      "mde-vue": "app://./libs/mde/mde.esm.js"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./mirror/mirror-main.js"></script>
</body>
</html>
